<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | {{ site.title | escape }}</title>
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/+$/, "");
      var prefix = "/redirect/";
      if (path.indexOf(prefix) !== 0) return;

      var slug = path.slice(prefix.length);
      if (!slug || slug.indexOf("/") !== -1) return;

      var redirects = {{ site.data.redirect | jsonify }};
      var destination = redirects[slug];
      if (typeof destination === "string" && /^https?:\/\//i.test(destination)) {
        window.location.replace(destination);
      }
    }());
  </script>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>This address does not have a page or redirect configured.</p>
    <p><a href="{{ '/' | relative_url }}">Return to the homepage</a></p>
  </main>
</body>
</html>
